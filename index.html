<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Missense Variant Pathogenicity AR Demo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <script>
    AFRAME.registerComponent("dna-helix", {
      init: function () {
        const colors = ["#45d7ff", "#ff6fae", "#ffd166", "#50e3a4"];

        for (let i = 0; i < 10; i++) {
          const y = i * 0.16;
          const angle = i * 0.72;
          const x = Math.cos(angle) * 0.34;
          const z = Math.sin(angle) * 0.34;

          const left = document.createElement("a-sphere");
          left.setAttribute("position", `${x} ${y} ${z}`);
          left.setAttribute("radius", "0.055");
          left.setAttribute("color", "#39c6ff");
          this.el.appendChild(left);

          const right = document.createElement("a-sphere");
          right.setAttribute("position", `${-x} ${y} ${-z}`);
          right.setAttribute("radius", "0.055");
          right.setAttribute("color", "#ff6fae");
          this.el.appendChild(right);

          const rung = document.createElement("a-box");
          rung.setAttribute("position", `0 ${y} 0`);
          rung.setAttribute("width", "0.68");
          rung.setAttribute("height", "0.018");
          rung.setAttribute("depth", "0.018");
          rung.setAttribute("rotation", `0 ${angle * 57.3} 0`);
          rung.setAttribute("color", colors[i % colors.length]);
          this.el.appendChild(rung);
        }
      }
    });
  </script>

  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #intro {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px 14px;
      color: white;
      background: rgba(8, 18, 40, 0.84);
      border-radius: 12px;
      line-height: 1.35;
      font-size: 14px;
    }

    #intro strong {
      color: #7de3ff;
    }

    #close {
      float: right;
      border: 0;
      background: transparent;
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div id="intro">
    <button id="close">×</button>
    <strong>Missense Variant Pathogenicity AR Demo</strong><br>
    Point your camera at the Hiro marker to view our machine-learning project visualization.
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    loading-screen="enabled: false">

    <a-marker preset="hiro" smooth="true" smooth-count="5">

      <a-entity rotation="0 0 90">

        <!-- Main title card -->
        <a-box
          position="0 1.84 -0.04"
          width="2.35"
          height="0.55"
          depth="0.05"
          color="#ffffff"
          opacity="0.9">
        </a-box>

        <a-text
          value="MISSENSE VARIANT"
          position="0 1.96 0.02"
          align="center"
          color="#111111"
          width="2.05">
        </a-text>

        <a-text
          value="Pathogenicity Prediction"
          position="0 1.77 0.02"
          align="center"
          color="#111111"
          width="1.65">
        </a-text>

        <!-- DNA structure -->
        <a-entity
          dna-helix
          position="0 0.32 0"
          scale="0.9 0.9 0.9">
        </a-entity>

        <a-text
          value="Genetic variant"
          position="0 0.05 0.02"
          align="center"
          color="#111111"
          width="1.45">
        </a-text>

        <!-- Conservation features -->
        <a-sphere
          position="-0.9 1.05 0"
          radius="0.09"
          color="#4e9cff">
        </a-sphere>

        <a-box
          position="-1.12 1.05 -0.04"
          width="1.45"
          height="0.48"
          depth="0.05"
          color="#ffffff"
          opacity="0.9">
        </a-box>

        <a-text
          value="CONSERVATION FEATURES"
          position="-1.12 1.14 0.02"
          align="center"
          color="#111111"
          width="1.25">
        </a-text>

        <a-text
          value="Primate • Mammalian • Vertebrate"
          position="-1.12 0.95 0.02"
          align="center"
          color="#111111"
          width="1.1">
        </a-text>

        <!-- Population features -->
        <a-sphere
          position="0.9 1.05 0"
          radius="0.09"
          color="#32d296">
        </a-sphere>

        <a-box
          position="1.12 1.05 -0.04"
          width="1.45"
          height="0.48"
          depth="0.05"
          color="#ffffff"
          opacity="0.9">
        </a-box>

        <a-text
          value="POPULATION FEATURES"
          position="1.12 1.14 0.02"
          align="center"
          color="#111111"
          width="1.25">
        </a-text>

        <a-text
          value="gnomAD allele frequencies"
          position="1.12 0.95 0.02"
          align="center"
          color="#111111"
          width="1.1">
        </a-text>

        <!-- Amino-acid features -->
        <a-sphere
          position="0 -0.22 0"
          radius="0.09"
          color="#c084fc">
        </a-sphere>

        <a-box
          position="0 -0.43 -0.04"
          width="2.25"
          height="0.45"
          depth="0.05"
          color="#ffffff"
          opacity="0.9">
        </a-box>

        <a-text
          value="AMINO-ACID PROPERTIES"
          position="0 -0.35 0.02"
          align="center"
          color="#111111"
          width="1.65">
        </a-text>

        <a-text
          value="Charge • Volume • BLOSUM62"
          position="0 -0.53 0.02"
          align="center"
          color="#111111"
          width="1.45">
        </a-text>

        <!-- Model comparison card -->
        <a-box
          position="0 2.55 -0.04"
          width="2.55"
          height="0.9"
          depth="0.06"
          color="#ffffff"
          opacity="0.94">
        </a-box>

        <a-text
          value="GROUP MODEL COMPARISON"
          position="0 2.82 0.02"
          align="center"
          color="#111111"
          width="2.15">
        </a-text>

        <a-text
          value="Logistic Regression • RBF-SVM"
          position="0 2.63 0.02"
          align="center"
          color="#111111"
          width="1.75">
        </a-text>

        <a-text
          value="Multi-Kernel SVM • GMM"
          position="0 2.45 0.02"
          align="center"
          color="#111111"
          width="1.75">
        </a-text>

        <a-text
          value="46,000 variants • 2,100 genes • 28 features"
          position="0 2.28 0.02"
          align="center"
          color="#111111"
          width="1.7">
        </a-text>

        <!-- Validation information -->
        <a-box
          position="0 -0.85 -0.04"
          width="2.45"
          height="0.35"
          depth="0.05"
          color="#ffffff"
          opacity="0.9">
        </a-box>

        <a-text
          value="Standard + gene-disjoint validation"
          position="0 -0.85 0.02"
          align="center"
          color="#111111"
          width="1.9">
        </a-text>

        <a-text
          value="Educational research visualization - not a clinical diagnosis"
          position="0 -1.08 0.02"
          align="center"
          color="#111111"
          width="1.8">
        </a-text>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.getElementById("close").onclick = function () {
      document.getElementById("intro").style.display = "none";
    };
  </script>

</body>
</html>
