<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Missense Variant Demo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <script>
    AFRAME.registerComponent("dna-helix", {
      init: function () {
        const colors = ["#45d7ff", "#ff6fae", "#ffd166", "#50e3a4"];

        for (let i = 0; i < 10; i++) {
          const y = i * 0.16;
          const angle = i * 0.72;
          const x = Math.cos(angle) * 0.34;
          const z = Math.sin(angle) * 0.34;

          const left = document.createElement("a-sphere");
          left.setAttribute("position", `${x} ${y} ${z}`);
          left.setAttribute("radius", "0.055");
          left.setAttribute("color", "#39c6ff");
          this.el.appendChild(left);

          const right = document.createElement("a-sphere");
          right.setAttribute("position", `${-x} ${y} ${-z}`);
          right.setAttribute("radius", "0.055");
          right.setAttribute("color", "#ff6fae");
          this.el.appendChild(right);

          const rung = document.createElement("a-box");
          rung.setAttribute("position", `0 ${y} 0`);
          rung.setAttribute("width", "0.68");
          rung.setAttribute("height", "0.018");
          rung.setAttribute("depth", "0.018");
          rung.setAttribute("rotation", `0 ${angle * 57.3} 0`);
          rung.setAttribute("color", colors[i % colors.length]);
          this.el.appendChild(rung);
        }
      }
    });
  </script>

  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #intro {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px 14px;
      color: white;
      background: rgba(8, 18, 40, 0.84);
      border-radius: 12px;
      line-height: 1.35;
      font-size: 14px;
    }

    #intro strong {
      color: #7de3ff;
    }

    #close {
      float: right;
      border: 0;
      background: transparent;
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div id="intro">
    <button id="close">×</button>
    <strong>Missense Variant AR Demo</strong><br>
    Point your camera at the Hiro marker. The DNA visualization represents a genetic variant.
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    loading-screen="enabled: false">

    <a-marker preset="hiro" smooth="true" smooth-count="5">

      <!-- Keeps the visual upright -->
      <a-entity rotation="0 0 -90">

        <!-- Dark standing background -->
        <a-plane
          position="0 1.25 -0.14"
          width="3.25"
          height="3.25"
          color="#050b1d"
          opacity="0.94">
        </a-plane>

        <!-- Base for standing appearance -->
        <a-box
          position="0 -0.38 0"
          width="1.35"
          height="0.12"
          depth="0.42"
          color="#101f3d">
        </a-box>

        <!-- DNA and title -->
        <a-entity
          position="0 0.22 0"
          scale="0.78 0.78 0.78">

          <a-entity
            dna-helix
            position="0 0.28 0">
          </a-entity>

          <a-text
            value="GENETIC VARIANT"
            position="0 1.92 0.02"
            align="center"
            color="#79e8ff"
            width="2.35">
          </a-text>

          <a-text
            value="Missense change"
            position="0 1.76 0.02"
            align="center"
            color="#e9f7ff"
            width="1.7">
          </a-text>
        </a-entity>

        <!-- Conservation features -->
        <a-sphere
          position="-0.82 0.95 0"
          radius="0.09"
          color="#4e9cff">
        </a-sphere>

        <a-text
          value="PRIMATE\nphyloP / phastCons"
          position="-1.35 0.95 0"
          align="right"
          color="#d9f4ff"
          width="1.35">
        </a-text>

        <a-sphere
          position="0.82 0.95 0"
          radius="0.09"
          color="#32d296">
        </a-sphere>

        <a-text
          value="MAMMALIAN\nconservation"
          position="1.35 0.95 0"
          align="left"
          color="#d9f4ff"
          width="1.35">
        </a-text>

        <a-sphere
          position="0 0.08 0"
          radius="0.09"
          color="#c084fc">
        </a-sphere>

        <a-text
          value="VERTEBRATE CONSERVATION"
          position="0 -0.16 0"
          align="center"
          color="#d9f4ff"
          width="1.8">
        </a-text>

        <!-- Model output -->
        <a-plane
          position="0 2.45 0"
          width="2.25"
          height="0.78"
          color="#081d3b"
          opacity="0.96">
        </a-plane>

        <a-text
          value="MODEL OUTPUT"
          position="0 2.69 0.02"
          align="center"
          color="#7de3ff"
          width="2.2">
        </a-text>

        <a-text
          value="Multi-Kernel SVM"
          position="0 2.50 0.02"
          align="center"
          color="#ffffff"
          width="1.95">
        </a-text>

        <a-text
          value="Illustrative class: PATHOGENIC"
          position="0 2.31 0.02"
          align="center"
          color="#ff9fba"
          width="1.95">
        </a-text>

        <a-text
          value="Research visualization - not a diagnosis"
          position="0 -0.43 0"
          align="center"
          color="#ffe082"
          width="2.05">
        </a-text>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.getElementById("close").onclick = function () {
      document.getElementById("intro").style.display = "none";
    };
  </script>
</body>
</html>
