<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Missense Variant Demo</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #intro {
      position: fixed; z-index: 10; left: 12px; right: 12px; top: 12px;
      padding: 12px 14px; color: white; background: rgba(8, 18, 40, .82);
      border-radius: 12px; line-height: 1.35; font-size: 14px;
    }
    #intro strong { color: #7de3ff; }
    #close { float: right; border: 0; background: transparent; color: white; font-size: 20px; }
  </style>
</head>
<body>
  <div id="intro">
    <button id="close" aria-label="Close">×</button>
    <strong>Missense Variant AR Demo</strong><br>
    Point your camera at the Hiro marker. The DNA visualization represents a variant and the
    conservation features used by the machine-learning model.
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    loading-screen="enabled: false">

    <a-marker preset="hiro" smooth="true" smooth-count="5">
      <!-- DNA backbone -->
      <a-entity id="dna" position="0 0.35 0" rotation="0 0 0">
        <a-cylinder position="-0.42 0.65 0" radius="0.035" height="1.3" color="#35b9ff"></a-cylinder>
        <a-cylinder position="0.42 0.65 0" radius="0.035" height="1.3" color="#35b9ff"></a-cylinder>

        <!-- base pairs -->
        <a-box position="0 0.15 0" width="0.85" height="0.035" depth="0.035" color="#ff6b9d"></a-box>
        <a-box position="0 0.35 0" width="0.85" height="0.035" depth="0.035" color="#ffd166"></a-box>
        <a-box position="0 0.55 0" width="0.85" height="0.035" depth="0.035" color="#06d6a0"></a-box>
        <a-box position="0 0.75 0" width="0.85" height="0.035" depth="0.035" color="#ff6b9d"></a-box>
        <a-box position="0 0.95 0" width="0.85" height="0.035" depth="0.035" color="#ffd166"></a-box>
        <a-box position="0 1.15 0" width="0.85" height="0.035" depth="0.035" color="#06d6a0"></a-box>
      </a-entity>

      <!-- Feature bubbles -->
      <a-sphere position="-0.82 0.75 0" radius="0.11" color="#4e9cff"></a-sphere>
      <a-text value="Primate\nphyloP/phastCons" position="-1.35 0.75 0" align="right" color="#d9f4ff" width="1.45"></a-text>
      <a-sphere position="0.82 1.05 0" radius="0.11" color="#32d296"></a-sphere>
      <a-text value="Mammalian\nconservation" position="1.35 1.05 0" align="left" color="#d9f4ff" width="1.45"></a-text>
      <a-sphere position="0.82 0.45 0" radius="0.11" color="#c084fc"></a-sphere>
      <a-text value="Vertebrate\nconservation" position="1.35 0.45 0" align="left" color="#d9f4ff" width="1.45"></a-text>

      <!-- Educational output panel -->
      <a-plane position="0 1.85 0" width="2.35" height="0.7" color="#071b3a" opacity="0.94"></a-plane>
      <a-text value="MISSENSE VARIANT" position="0 2.08 0.02" align="center" color="#7de3ff" width="2.8"></a-text>
      <a-text value="Multi-Kernel SVM\nPrediction: Pathogenic\nConfidence: illustrative" position="0 1.82 0.02" align="center" color="white" width="2.25"></a-text>
      <a-text value="Educational visualization — not a clinical diagnosis" position="0 -0.02 0" align="center" color="#ffe082" width="2.3"></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.getElementById('close').onclick = () => {
      document.getElementById('intro').style.display = 'none';
    };
  </script>
</body>
</html>
